<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
    <div id="authScreen" class="auth-screen">
        <div class="auth-right">
            <div class="auth-container">
                <div class="auth-header">
                    <h1>SMART CITY</h1>
                    <p>Intelligent Urban Management System</p>
                </div>

                <div id="loginForm" class="auth-form active">
                    <h2>Login</h2>
                    
                    <div class="login-type-selector">
                        <div class="login-type-btn active" id="userLoginBtn" onclick="selectUserLogin()">
                            <span class="icon">👤</span>
                            <span class="label">User Login</span>
                        </div>
                        <div class="login-type-btn" id="adminLoginBtn" onclick="selectAdminLogin()">
                            <span class="icon">🔒</span>
                            <span class="label">Admin Login</span>
                        </div>
                    </div>
                    
                    <form id="loginFormElement" onsubmit="return handleLogin(event)">
                        <input type="hidden" id="loginRole" value="user">
                        <div class="form-group">
                            <label for="loginName">Name (Username)</label>
                            <input type="text" id="loginName" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="captchaInput">Enter CAPTCHA *</label>
                            <div class="captcha-container">
                                <div class="captcha-img-wrap">
                                    <img id="captchaImg" alt="CAPTCHA" style="height:60px;border-radius:8px;border:2px dashed #667eea;background:#f0f4ff;display:block;">
                                    <div id="captchaLoading" style="height:60px;display:flex;align-items:center;justify-content:center;color:#667eea;font-size:0.85rem;display:none;">Loading...</div>
                                </div>
                                <button type="button" class="captcha-refresh" onclick="loadCaptcha()" title="Refresh CAPTCHA">🔄</button>
                            </div>
                            <input type="text" id="captchaInput" required placeholder="Enter the code shown above" autocomplete="off">
                            <span class="error-message" id="captchaError"></span>
                        </div>
                        <button type="submit" class="btn-primary">Login</button>
                    </form>
                    <p class="demo-credentials">
                        <strong>🔑 Demo Credentials</strong><br>
                        <small>
                            <strong>Admin:</strong> srisanth / SASI@1234<br>
                            <strong>User:</strong> Regular User / user123
                        </small>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3000';
        let currentCaptchaId = '';

        async function loadCaptcha() {
            const img = document.getElementById('captchaImg');
            const loading = document.getElementById('captchaLoading');
            img.style.display = 'none';
            loading.style.display = 'flex';
            document.getElementById('captchaInput').value = '';
            document.getElementById('captchaError').textContent = '';
            try {
                const res = await fetch(`${API}/api/captcha`);
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();
                currentCaptchaId = data.captchaId;
                img.src = data.captchaImage;
                img.style.display = 'block';
                loading.style.display = 'none';
            } catch (e) {
                loading.textContent = '⚠️ Failed to load. Click 🔄';
                loading.style.display = 'flex';
                console.error('CAPTCHA load error:', e);
            }
        }

        function selectUserLogin() {
            document.getElementById('userLoginBtn').classList.add('active');
            document.getElementById('adminLoginBtn').classList.remove('active');
            document.getElementById('loginRole').value = 'user';
        }

        function selectAdminLogin() {
            document.getElementById('adminLoginBtn').classList.add('active');
            document.getElementById('userLoginBtn').classList.remove('active');
            document.getElementById('loginRole').value = 'admin';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const name = document.getElementById('loginName').value.trim();
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;
            const captchaInput = document.getElementById('captchaInput').value.trim();
            const captchaError = document.getElementById('captchaError');

            if (!captchaInput) {
                captchaError.textContent = 'Please enter the CAPTCHA';
                return false;
            }

            // Verify CAPTCHA with backend
            try {
                const verifyRes = await fetch(`${API}/api/captcha/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ captchaId: currentCaptchaId, captchaInput })
                });
                const { valid, reason } = await verifyRes.json();
                if (!valid) {
                    captchaError.textContent = reason === 'expired' ? 'CAPTCHA expired. Refreshed.' : 'Incorrect CAPTCHA. Try again.';
                    loadCaptcha();
                    return false;
                }
            } catch (e) {
                captchaError.textContent = 'Could not verify CAPTCHA. Is the server running?';
                return false;
            }

            // Attempt login via API
            try {
                const loginRes = await fetch(`${API}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password, role })
                });
                const data = await loginRes.json();
                if (!loginRes.ok) {
                    alert(data.error || 'Invalid credentials');
                    loadCaptcha();
                    return false;
                }
                localStorage.setItem('token', data.token);
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                window.location.href = 'index.html';
            } catch (e) {
                alert('Login failed. Is the server running?');
                loadCaptcha();
            }
            return false;
        }

        // Load CAPTCHA on page load
        loadCaptcha();
    </script>
</body>
</html>
